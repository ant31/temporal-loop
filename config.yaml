# Global configuration for Temporal.io connection and behavior.
temporalio:
  # Address of the Temporal Frontend.
  host: "127.0.0.1:7233"
  # Temporal namespace to connect to.
  namespace: "default"
  # Default worker factory to use if not specified per worker.
  default_factory: "temporalloop.worker:WorkerFactory"
  # Global list of interceptors to be applied to all workers.
  # Interceptors are specified as import strings.
  interceptors:
    - "temporalloop.interceptors.sentry:SentryInterceptor"

# Configuration for individual workers.
workers:
  - name: "example-worker-1"
    # Task queue for this worker.
    queue: "example-queue-1"
    # List of workflows for this worker, specified as import strings.
    workflows:
      - "your_package.workflows:YourWorkflow"
    # List of activities for this worker, specified as import strings.
    activities:
      - "your_package.activities:your_activity_one"
      - "your_package.activities:your_activity_two"
    # Worker-specific settings can be overridden here.
    # For example, to override the namespace for this worker:
    # namespace: "staging"

  - name: "example-worker-2"
    queue: "example-queue-2"
    workflows:
      - "your_package.workflows:AnotherWorkflow"
    activities:
      - "your_package.activities:another_activity"
    # Example of overriding concurrency settings for this worker.
    max_concurrent_activities: 50
    max_concurrent_workflow_tasks: 50

# Logging configuration.
logging:
  # The log level for the application.
  level: "INFO"
  # Whether to use colorized logging output.
  use_colors: true
  # You can also provide a path to a standard Python logging configuration file.
  # log_config: "/path/to/your/logging_config.ini"

# Declarative schedule management.
schedules:
  my-hourly-workflow:
    # The workflow ID that will be used for each run.
    workflow_id: "my-workflow-id-001"
    # Import string for the workflow to run.
    workflow: "my_project.workflows:GreetingWorkflow"
    # Task queue for the workflow executions.
    task_queue: "greeting-queue"
    # State can be "created", "paused", or "deleted".
    state: "created"
